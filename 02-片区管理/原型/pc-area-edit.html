<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑片区 · 英莱达资产管理系统</title>
<link rel="stylesheet" href="../../00-整体需求/主页原型/assets/app.css">
<style>
  /* ===== 页面级补充样式（仅取色 CSS 变量） ===== */
  /* 片区范围选择（同 pc-home） */
  .scope{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink2);font-size:13px;cursor:pointer}
  .scope:hover{border-color:var(--brand);color:var(--brand)}

  /* 业态选择 chip */
  .type-chips{display:flex;gap:10px;flex-wrap:wrap}
  .type-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel);color:var(--ink2);font-size:13.5px;cursor:pointer;user-select:none}
  .type-chip:hover{border-color:var(--brand);color:var(--brand)}
  .type-chip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand);font-weight:600}
  .type-chip.off{color:var(--ink3);background:var(--paper);cursor:not-allowed}
  .type-chip.off:hover{border-color:var(--line);color:var(--ink3)}

  /* 数据权限员工标签 */
  .staff-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .staff-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 12px;border-radius:999px;background:var(--brand-bg);color:var(--brand);font-size:13px;font-weight:500}
  .staff-chip .x{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand)}
  .staff-chip .x:hover{background:var(--brand);color:#fff}
  .staff-add{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;border:1px dashed var(--line);color:var(--ink3);font-size:13px;cursor:pointer;background:var(--panel)}
  .staff-add:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body>
<div class="layout">

  <!-- ========== 左侧导航 ========== -->
  <aside class="sidebar" id="amsNav" data-active="area" data-ver="V1.1 原型 · 本期范围：片区管理"></aside>

  <!-- ========== 主区域 ========== -->
  <div class="main">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="crumb"><span>片区管理 / </span>编辑片区</div>
      <div class="right">
        <div class="scope">
          片区范围：全部片区
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
        </div>
        <div class="bell">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="bdg">6</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="avatar">陈</span>
          <span style="color:var(--ink)">陈志远 · 运营主管</span>
        </div>
      </div>
    </header>

    <!-- 内容区 -->
    <div class="content">

      <div class="panel">
        <div class="form">

          <!-- 基础信息 -->
          <div class="f-sec">
            <h4>基础信息</h4>
            <div class="f-grid">
              <div class="f-item">
                <label><span class="req">*</span>片区名称</label>
                <input class="inp" value="滨江科创园区">
              </div>
              <div class="f-item">
                <label><span class="req">*</span>片区编码</label>
                <input class="inp num" value="AREA-BJ">
                <span class="help">用于单据编号前缀，创建后不可改</span>
              </div>
              <div class="f-item">
                <label>所在城市</label>
                <select class="sel">
                  <option selected>杭州市</option>
                  <option>宁波市</option>
                  <option>温州市</option>
                </select>
              </div>
              <div class="f-item">
                <label>所在区域</label>
                <select class="sel">
                  <option selected>滨江区</option>
                  <option>西湖区</option>
                  <option>拱墅区</option>
                  <option>余杭区</option>
                </select>
              </div>
              <div class="f-item full">
                <label><span class="req">*</span>详细地址</label>
                <input class="inp" value="滨江区江南大道 1288 号">
              </div>
              <div class="f-item">
                <label><span class="req">*</span>负责人</label>
                <input class="inp" value="王建国">
              </div>
              <div class="f-item">
                <label><span class="req">*</span>联系电话</label>
                <input class="inp num" value="13805716621">
              </div>
              <div class="f-item full">
                <label>片区简介</label>
                <textarea class="ta">滨江科创园区位于江南大道沿线，紧邻地铁 1 号线江陵路站，通勤便利。片区共 3 栋 208 间公寓房源，主力户型为一居室与两居室，面向周边高新企业员工出租。</textarea>
              </div>
            </div>
          </div>

          <!-- 数据权限 -->
          <div class="f-sec">
            <h4>数据权限</h4>
            <div class="f-grid">
              <div class="f-item full">
                <label>管理员工</label>
                <div class="staff-chips">
                  <span class="staff-chip">陈志远
                    <span class="x"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
                  </span>
                  <span class="staff-chip">李梅
                    <span class="x"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
                  </span>
                  <span class="staff-add">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    添加员工
                  </span>
                </div>
                <span class="help">被授权员工可在 PC 与移动管理端查看、操作本片区数据</span>
              </div>
            </div>
          </div>

          <!-- 操作 -->
          <div class="f-actions">
            <a class="btn primary" href="pc-area-list.html">保存</a>
            <a class="btn ghost" href="pc-area-list.html">取消</a>
          </div>

        </div>
      </div>

      <!-- 页脚说明 -->
      <div style="margin-top:16px">
        <span class="note">片区下已存在房源/合同数据时不可删除，仅可停用；停用后不影响存量业务，新业务不可再选该片区；业态与楼栋结构配置已下沉至「片区详情 - 业态」层维护</span>
      </div>

    </div>
  </div>
</div>
<script src="../../00-整体需求/主页原型/assets/nav.js"></script>
</body>
</html>
