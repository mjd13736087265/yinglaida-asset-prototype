<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑业态 · 云谷人才公寓 · 英莱达资产管理系统</title>
<link rel="stylesheet" href="../../00-整体需求/主页原型/assets/app.css">
<style>
  /* ===== 页面级补充样式（仅取色 CSS 变量） ===== */
  /* 片区范围选择（同 pc-home） */
  .scope{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink2);font-size:13px;cursor:pointer}
  .scope:hover{border-color:var(--brand);color:var(--brand)}

  /* 楼栋结构配置行 */
  .bld-row{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr 34px;gap:12px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line2)}
  .bld-row:last-of-type{border-bottom:none}
  .bld-row .f-item{gap:5px}
  .bld-row .subtotal{font-size:14px;color:var(--ink);font-weight:600;padding-bottom:9px;white-space:nowrap}
  .bld-row .subtotal small{font-size:12px;color:var(--ink3);font-weight:400;margin-left:4px}
  .bld-del{width:34px;height:36px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink3);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .bld-del:hover{border-color:var(--red);color:var(--red)}
  .bld-add{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--ink2);font-size:13px;cursor:pointer;margin-top:12px}
  .bld-add:hover{border-color:var(--brand);color:var(--brand)}
  .bld-sum{margin-top:12px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .bld-sum b{color:var(--brand);font-weight:700}
</style>
</head>
<body>
<div class="layout">

  <!-- ========== 左侧导航 ========== -->
  <aside class="sidebar" id="amsNav" data-active="area" data-ver="V1.1 原型 · 本期范围：片区管理"></aside>

  <!-- ========== 主区域 ========== -->
  <div class="main">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="crumb"><span><a href="../../00-整体需求/主页原型/pc-home.html" style="color:inherit">首页</a> / <a href="pc-area-list.html" style="color:inherit">片区管理</a> / <a href="pc-area-detail.html" style="color:inherit">云谷创业园区</a> / </span>编辑业态</div>
      <div class="right">
        <div class="scope">
          片区范围：全部片区
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
        </div>
        <div class="bell">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
          <span class="bdg">6</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="avatar">陈</span>
          <span style="color:var(--ink)">陈志远 · 运营主管</span>
        </div>
      </div>
    </header>

    <!-- 内容区 -->
    <div class="content">

      <div class="panel">
        <div class="form">

          <!-- 基础信息 -->
          <div class="f-sec">
            <h4>基础信息</h4>
            <div class="f-grid">
              <div class="f-item">
                <label><span class="req">*</span>业态名称</label>
                <input class="inp" value="云谷人才公寓">
                <span class="help">同一片区下允许存在多个同类型业态，名称需片区内唯一</span>
              </div>
              <div class="f-item">
                <label>所属片区</label>
                <input class="inp ro" value="云谷创业园区" readonly>
              </div>
              <div class="f-item full">
                <label><span class="req">*</span>业态类型</label>
                <select class="sel">
                  <option selected>公寓</option>
                  <option>酒店</option>
                  <option>停车场</option>
                  <option>写字楼</option>
                  <option>商业</option>
                </select>
                <span class="note" style="margin-top:4px">业态类型来源于 系统管理 - 字典配置，可按需增删；本期仅「公寓」类型开放后续管理功能</span>
              </div>
            </div>
          </div>

          <!-- 楼栋结构配置 -->
          <div class="f-sec">
            <h4>楼栋结构配置</h4>
            <div class="f-grid">
              <div class="f-item full">
                <div class="bld-row">
                  <div class="f-item"><label>楼栋名称</label><input class="inp" value="1 栋"></div>
                  <div class="f-item"><label>层数</label><input class="inp num" value="10"></div>
                  <div class="f-item"><label>每层间数</label><input class="inp num" value="10"></div>
                  <div class="subtotal num">100 间<small>自动计算</small></div>
                  <span class="bld-del"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/></svg></span>
                </div>
                <div class="bld-row">
                  <div class="f-item"><label>楼栋名称</label><input class="inp" value="2 栋"></div>
                  <div class="f-item"><label>层数</label><input class="inp num" value="10"></div>
                  <div class="f-item"><label>每层间数</label><input class="inp num" value="10"></div>
                  <div class="subtotal num">100 间<small>自动计算</small></div>
                  <span class="bld-del"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/></svg></span>
                </div>
                <div class="bld-row">
                  <div class="f-item"><label>楼栋名称</label><input class="inp" value="3 栋"></div>
                  <div class="f-item"><label>层数</label><input class="inp num" value="6"></div>
                  <div class="f-item"><label>每层间数</label><input class="inp num" value="10"></div>
                  <div class="subtotal num">60 间<small>自动计算</small></div>
                  <span class="bld-del"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/></svg></span>
                </div>
                <span class="bld-add">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                  添加楼栋
                </span>
                <div class="bld-sum">共 <b class="num">3</b> 栋 · 合计 <b class="num">260</b> 间（层数 × 每层间数自动汇总）</div>
                <span class="help" style="margin-top:6px">已存在房源/合同数据的楼栋不可删除，仅可停用；房间号按「楼层+序号」自动生成</span>
              </div>
            </div>
          </div>

          <!-- 备注 -->
          <div class="f-sec">
            <h4>备注</h4>
            <div class="f-grid">
              <div class="f-item full">
                <label>业态备注</label>
                <textarea class="ta">云谷人才公寓面向园区企业员工出租，主力户型为一居室与单间，配套共享食堂与健身房。</textarea>
              </div>
            </div>
          </div>

          <!-- 操作 -->
          <div class="f-actions">
            <a class="btn primary" href="pc-area-detail.html">保存</a>
            <a class="btn ghost" href="pc-area-detail.html">取消</a>
          </div>

        </div>
      </div>

      <!-- 页脚说明 -->
      <div style="margin-top:16px">
        <span class="note">楼栋结构属于业态（L2），不随片区（L1）；业态下已存在房源/合同数据时不可删除，仅可停用</span>
      </div>

    </div>
  </div>
</div>
<script src="../../00-整体需求/主页原型/assets/nav.js"></script>
</body>
</html>
