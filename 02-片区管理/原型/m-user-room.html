<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动用户端 · 房源详情 · 英莱达资管</title>
<link rel="stylesheet" href="../../00-整体需求/主页原型/assets/app.css">
<style>
  /* 页面级补充样式（仅使用 app.css 已定义的 CSS 变量取色） */
  /* 顶部渐变图区 */
  .hero{height:220px;background:linear-gradient(135deg,var(--brand),var(--purple));position:relative;flex-shrink:0;color:#fff}
  .hero .h-back{position:absolute;top:46px;left:14px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff}
  .hero .h-back svg{width:18px;height:18px}
  .hero .tag.free{position:absolute;top:50px;right:14px}
  .hero .h-loc{position:absolute;left:16px;bottom:32px;font-size:12px;opacity:.92;display:flex;align-items:center;gap:4px}
  .hero .h-loc svg{width:14px;height:14px}
  /* demo-mark 移至返回按钮右侧，避免与右上标签重叠 */
  .demo-mark{left:60px;right:auto;top:52px}
  /* 上叠信息卡 */
  .h-card{background:var(--panel);border-radius:var(--r-lg) var(--r-lg) 0 0;margin:-20px 0 0;padding:16px 16px 14px;position:relative;z-index:5}
  .h-card .t{font-size:17px;font-weight:700}
  .h-card .pr{display:flex;align-items:baseline;gap:10px;margin-top:8px}
  .h-card .pr .p{color:var(--red);font-size:22px;font-weight:700;line-height:1.2}
  .h-card .pr .p small{font-size:12px;color:var(--ink3);font-weight:400}
  .h-card .pr .dp{font-size:12px;color:var(--ink2)}
  .tag-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  /* 配套设施 */
  .feats{display:flex;flex-wrap:wrap;background:var(--panel);padding:4px 14px 16px}
  .feats .ft{flex:0 0 25%;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink2);padding:8px 0}
  .feats .ft svg{width:24px;height:24px;color:var(--brand)}
  .feats .ft span{font-size:12px}
  /* 简介 */
  .intro{background:var(--panel);padding:2px 14px 16px;font-size:13.5px;color:var(--ink2);line-height:1.75}
  .note-row{margin:10px 14px 14px}
  /* 画板 iframe 无缝嵌入模式（?embed=1）：去手机壳与舞台底 */
  body.embed{display:block;padding:0;min-height:auto;background:transparent}
  body.embed .cap{display:none}
  body.embed .device{gap:0}
  body.embed .phone{width:100%;height:100vh;border:0;border-radius:0;box-shadow:none}
  body.embed .notch{display:none}
</style>
</head>
<body class="stage">
<script>
  if(/[?&]embed=1/.test(location.search))document.body.classList.add('embed');
</script>

<div class="device">
  <div class="cap">用户端 · 房源详情</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="demo-mark">演示数据</div>

    <div class="screen">

      <!-- 顶部渐变图区 -->
      <div class="hero">
        <a class="h-back" href="m-user-rooms.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <span class="tag free">可预订</span>
        <div class="h-loc">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.1-6-9.5a6 6 0 1 1 12 0C18 15.9 12 21 12 21z"/><circle cx="12" cy="11.5" r="2.2"/></svg>
          滨江科创园区 · 滨江人才公寓
        </div>
      </div>

      <!-- 上叠信息卡 -->
      <div class="h-card">
        <div class="t">滨江青年公寓 · 一室一厅</div>
        <div class="pr">
          <span class="p num">¥1,850<small> / 月</small></span>
          <span class="dp">押金：押一付一</span>
        </div>
        <div class="tag-row">
          <span class="chip">朝南</span>
          <span class="chip">精装</span>
          <span class="chip">近地铁</span>
          <span class="chip">随时入住</span>
        </div>
      </div>

      <!-- 房源信息 -->
      <div class="m-gt">房源信息</div>
      <div class="m-rows">
        <div class="r"><span class="k">户型</span><span class="v">一室一厅</span></div>
        <div class="r"><span class="k">面积</span><span class="v num">45㎡</span></div>
        <div class="r"><span class="k">楼层</span><span class="v num">3F</span></div>
        <div class="r"><span class="k">朝向</span><span class="v">南</span></div>
        <div class="r"><span class="k">租金</span><span class="v num">1,850 元/月</span></div>
        <div class="r"><span class="k">押金方式</span><span class="v">押一付一</span></div>
        <div class="r"><span class="k">物业费</span><span class="v">已含</span></div>
      </div>

      <!-- 配套设施 -->
      <div class="m-gt">配套设施</div>
      <div class="feats">
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="7" rx="2"/><path d="M7 9h10"/><path d="M8 16c.6 1.4-.6 2.4 0 4M12 16c.6 1.4-.6 2.4 0 4M16 16c.6 1.4-.6 2.4 0 4"/></svg>
          <span>空调</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="15" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M9 18v2M15 18v2"/></svg>
          <span>热水器</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M6 10a6 6 0 0 1 12 0z"/><path d="M8 14v2M12 14v3M16 14v2"/></svg>
          <span>淋浴</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h4v6H7z"/><path d="M7 9h12a5 5 0 0 1-5 5H9a2 2 0 0 1-2-2V9"/><path d="M9 19l1-3M15 19l-1-3"/></svg>
          <span>独立卫生间</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V6"/><path d="M4 14h16v4"/><path d="M20 14v-2a2 2 0 0 0-2-2h-8v4"/><circle cx="8" cy="10.5" r="1.5"/></svg>
          <span>床</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="17" rx="1.5"/><path d="M12 3v17"/><path d="M10 10v2M14 10v2"/></svg>
          <span>衣柜</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18"/><path d="M5 8v11M19 8v11"/><path d="M5 12h6v4H5z"/></svg>
          <span>书桌</span>
        </div>
        <div class="ft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5a13 13 0 0 1 17 0"/><path d="M6.5 13a8.5 8.5 0 0 1 11 0"/><path d="M9.5 16.5a4 4 0 0 1 5 0"/><circle cx="12" cy="19.5" r="1"/></svg>
          <span>WiFi</span>
        </div>
      </div>

      <!-- 公寓简介 -->
      <div class="m-gt">公寓简介</div>
      <div class="intro">位于滨江科创园区核心地段，近地铁 8 号线，精装拎包入住，管家式服务。周边商超、餐饮配套齐全，适合青年白领与园区人才长期居住。</div>

      <div class="note note-row">用户端详情为展示预留版式，预约/咨询交互后续模块完善</div>

    </div>

    <!-- 底部操作栏 -->
    <div class="m-cta">
      <div class="btn ghost">电话咨询</div>
      <div class="btn primary">预约看房</div>
    </div>

    <!-- 底部 Tab（共享组件 m-tab.js 渲染，见 原型对接规范.md §7） -->
    <div class="m-tab" id="amsTab" data-variant="user" data-active="room"></div>

  </div>
</div>

<script src="../../00-整体需求/主页原型/assets/m-tab.js"></script>
</body>
</html>
